  rateLimitExceededWhatDoesErrorMean: O que significa este erro?
  rateLimitExceededErrorMeaning: Esta página usa a API do GitHub para obter dados em tempo real sobre o estado dos serviços. Por omissão, o GitHub permite 60 pedidos por hora a cada endereço IP, que já foram consumidos.
