owner: djgamer07
repo: status

sites:
  - name: We Watch
    url: https://wewatch.pt
  - name: We Watch API
    url: https://wewatch.pt/api/health/ping

status-website:
  cname: status.wewatch.pt
  name: We Watch Status
  # Logo alojado no próprio repo (servido pelo GitHub Pages) — NUNCA na VPS,
  # senão a página de estado perdia o logo exatamente quando o site está em baixo.
  logoUrl: /logo.png
  favicon: /logo.png
  theme: dark
  introTitle: "Estado do **We Watch**"
  introMessage: "Monitorização em tempo real do site e da API. Se algo estiver em baixo, já estamos a tratar disso."
  navbar:
    - title: Estado
      href: /
    - title: wewatch.pt
      href: https://wewatch.pt
  # Tema We Watch — a página inteira é pintada por variáveis CSS; o seletor
  # duplicado (:root:root) garante que estas vencem o tema base "dark"
  # independentemente da ordem de carregamento.
  css: >-
    :root:root {
      --body-background-color: #0c0a18;
      --body-text-color: #f4f4f8;
      --card-background-color: #181229;
      --nav-background-color: #140f24;
      --nav-border-bottom-color: #2a2350;
      --nav-current-border-bottom-color: #635bed;
      --card-border-color: #2a2350;
      --down-border-left-color: #f87171;
      --down-background-color: #3d1420;
      --degraded-border-left-color: #fbbf24;
      --up-border-left-color: #34d399;
      --tag-color: #0c0a18;
      --tag-up-background-color: #34d399;
      --tag-down-background-color: #f87171;
      --tag-degraded-background-color: #fbbf24;
      --change-background-color: #fbbf24;
      --error-button-border-color: #4f46e5;
      --error-button-background-color: #635bed;
      --error-button-color: #ffffff;
      --submit-button-border-color: #4f46e5;
      --submit-button-background-color: #635bed;
      --submit-button-color: #ffffff;
      --graph-opacity: 1;
      --graph-filter: none;
    }
    body {
      background-image: radial-gradient(circle at 50% 0%, rgba(99, 91, 237, 0.18), transparent 55%);
      background-repeat: no-repeat;
    }
    a { color: #8b83f7; }
    img[alt="We Watch Status"] { border-radius: 8px; }

